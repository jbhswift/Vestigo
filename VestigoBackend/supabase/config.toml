
[functions.vestigo-api]
enabled = true
verify_jwt = false
import_map = "./functions/vestigo-api/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/vestigo-api/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/vestigo-api/*.html" ]

[functions.vestigo-friends]
enabled = true
verify_jwt = true
entrypoint = "./functions/vestigo-friends/index.ts"
